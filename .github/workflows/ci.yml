name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-data:
    name: Private data scan
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Scan for personal paths and secret material
        run: scripts/scan-private-data.sh --tree

  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install age (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Install age (macOS)
        if: runner.os == 'macOS'
        run: brew install age

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Test
        env:
          CREDROUTE_NO_NETWORK: "1"
        run: go test ./... -count=1
